<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="broth" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f7b267"/>
      <stop offset="70%" stop-color="#e8873a"/>
      <stop offset="100%" stop-color="#c8641f"/>
    </radialGradient>
    <radialGradient id="bowl" cx="50%" cy="45%" r="55%">
      <stop offset="80%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9dde3"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.25"/>
    </filter>
    <style>
      .p { font: 900 46px "Arial Rounded MT Bold", "Comic Sans MS", sans-serif;
           fill: #f6e3a8; stroke: #c99a3c; stroke-width: 2.5; paint-order: stroke; }
      .s { font-size: 30px; opacity: .85; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#2f4858"/>
  <rect y="0" width="800" height="600" fill="#355c6e" opacity=".4"/>

  <!-- tallerken og skål -->
  <ellipse cx="400" cy="310" rx="320" ry="270" fill="#eef1f4" filter="url(#shadow)"/>
  <circle cx="400" cy="300" r="240" fill="url(#bowl)" filter="url(#shadow)"/>
  <circle cx="400" cy="300" r="205" fill="url(#broth)"/>
  <ellipse cx="340" cy="220" rx="70" ry="22" fill="#fff" opacity=".18" transform="rotate(-25 340 220)"/>

  <!-- grønnsaker -->
  <g fill="#f08a24" stroke="#c9601a" stroke-width="2">
    <circle cx="290" cy="380" r="13"/><circle cx="520" cy="200" r="12"/>
    <circle cx="510" cy="400" r="11"/><circle cx="300" cy="200" r="10"/>
  </g>
  <g fill="#6bbf59" stroke="#3f8a35" stroke-width="2">
    <circle cx="455" cy="440" r="8"/><circle cx="250" cy="300" r="8"/>
    <circle cx="560" cy="300" r="7"/><circle cx="380" cy="160" r="7"/>
  </g>

  <!-- bokstavene -->
  <g class="p">
    <g transform="rotate(-12 330 230)"><text x="270" y="245">S</text><text x="305" y="240">S</text><text x="342" y="248">G</text></g>
    <g transform="rotate(8 470 250)"><text x="425" y="262">I</text><text x="445" y="258">S</text><text x="480" y="264">R</text></g>
    <g transform="rotate(-4 390 315)"><text x="345" y="330">P</text><text x="380" y="324">P</text><text x="415" y="332">R</text></g>
    <g transform="rotate(15 300 380)"><text x="250" y="395">C</text><text x="288" y="390">S</text><text x="322" y="398">R</text></g>
    <g transform="rotate(-10 480 390)"><text x="430" y="405">S</text><text x="465" y="398">S</text><text x="500" y="408">R</text></g>
  </g>

  <!-- løse bokstaver -->
  <g class="p s">
    <text x="215" y="270" transform="rotate(40 215 270)">A</text>
    <text x="560" y="350" transform="rotate(-30 560 350)">Q</text>
    <text x="400" y="200" transform="rotate(70 400 200)">K</text>
    <text x="380" y="460" transform="rotate(-50 380 460)">E</text>
    <text x="560" y="240" transform="rotate(20 560 240)">X</text>
  </g>

  <!-- skje -->
  <g transform="rotate(35 650 470)">
    <rect x="620" y="440" width="190" height="18" rx="9" fill="#b8bec7"/>
    <ellipse cx="610" cy="449" rx="45" ry="30" fill="#cfd4da" stroke="#9aa1aa" stroke-width="2"/>
  </g>
</svg>
